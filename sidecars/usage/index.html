<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Model Usage</title>
<script src="/preload.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg-light: #ffffff;
    --bg-dark: #131314;
    --fg-light: #1f2328;
    --fg-dark: #e3e3e3;
    --dim-light: #59636e;
    --dim-dark: #9aa0a6;

    --background: var(--bg-light);
    --foreground: var(--fg-light);
    --muted-foreground: var(--dim-light);
    --border: rgba(127, 127, 127, 0.25);

    --c-ok: #2da44e;
    --c-warn: #d29922;
    --c-danger: #cf222e;
    --c-accent: #0969da;
    --c-purple: #8250df;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background: var(--bg-dark);
      --foreground: var(--fg-dark);
      --muted-foreground: var(--dim-dark);
      --c-ok: #3fb950;
      --c-warn: #d29922;
      --c-danger: #f85149;
      --c-accent: #58a6ff;
      --c-purple: #a371f7;
    }
  }

  @supports (color: light-dark(white, black)) {
    :root {
      --background: light-dark(var(--bg-light), var(--bg-dark));
      --foreground: light-dark(var(--fg-light), var(--fg-dark));
      --muted-foreground: light-dark(var(--dim-light), var(--dim-dark));
      --c-ok: light-dark(#2da44e, #3fb950);
      --c-danger: light-dark(#cf222e, #f85149);
      --c-accent: light-dark(#0969da, #58a6ff);
      --c-purple: light-dark(#8250df, #a371f7);
    }
  }

  :root {
    --fg: var(--foreground);
    --dim: var(--muted-foreground);
    --line: var(--border);
    --track: color-mix(in srgb, var(--dim) 22%, transparent);
    --surface: color-mix(in srgb, var(--fg) 3.5%, transparent);
    --c-seg-in: var(--c-accent);
    --c-seg-out: var(--c-ok);
    --c-seg-think: var(--c-purple);
    --c-seg-cache: var(--c-warn);
    scrollbar-width: thin;
    scrollbar-color: var(--dim) transparent;
  }

  @supports not (scrollbar-color: auto) {
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--background);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 12px 14px 18px; }
  .num { font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* Header & Main Tabs */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .live {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dim);
    flex: none;
  }
  .live.on { background: var(--c-ok); }
  .live.err { background: var(--c-danger); }

  .tab-bar {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .tab-btn {
    border: none;
    border-radius: 4px;
    padding: 2px 9px;
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    background: transparent;
    cursor: pointer;
  }
  .tab-btn:hover:not(.active) { color: var(--fg); }
  .tab-btn.active {
    color: var(--fg);
    background: color-mix(in srgb, var(--fg) 10%, transparent);
    font-weight: 600;
  }

  button {
    font: inherit;
    font-size: 12px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button:disabled { color: var(--dim); cursor: default; }

  /* Notice / Warning banner */
  .notice {
    margin-top: 10px;
    padding: 7px 9px;
    border: 1px solid var(--c-warn);
    border-radius: 5px;
    font-size: 12px;
    color: var(--fg);
  }
  .notice.error { border-color: var(--c-danger); }

  /* Sections */
  section {
    margin-top: 14px;
  }
  section + section {
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .sec-sub {
    margin: 0 0 8px;
    font-size: 11.5px;
    color: var(--dim);
  }
  .sec-caption {
    font-size: 11px;
    color: var(--dim);
  }

  /* Quota Bucket Row */
  .bucket-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bucket {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .bucket-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }
  .bucket-label {
    font-weight: 500;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tag {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 1.5;
    flex: none;
  }
  .tag.ok { color: var(--c-ok); border-color: var(--c-ok); }
  .bucket-stats {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
  }
  .pct-main {
    font-size: 13px;
    font-weight: 600;
  }
  .pct-used {
    font-size: 11px;
    color: var(--dim);
  }
  .bar-track {
    position: relative;
    width: 100%;
    height: 6px;
    background: var(--track);
    border-radius: 3px;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--c-ok);
  }
  .bar-fill.warn { background: var(--c-warn); }
  .bar-fill.danger { background: var(--c-danger); }
  .bar-tick {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    border-radius: 1px;
    background: var(--fg);
    box-shadow: 0 0 0 1px var(--background);
    transform: translateX(-50%);
    pointer-events: none;
  }
  .bucket-meta {
    margin-top: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
    color: var(--dim);
  }

  /* Plan & Credits rows */
  .kv-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .kv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
  }
  .kv-val {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .links-row {
    margin-top: 8px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  a.ext-link {
    font-size: 11.5px;
    color: var(--c-accent);
    text-decoration: none;
  }
  a.ext-link:hover { text-decoration: underline; }

  /* Stats View Controls */
  .stats-toolbar {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip-group {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1.5px;
    gap: 1px;
  }
  .chip-btn {
    border: none;
    border-radius: 3.5px;
    padding: 2px 7px;
    font-size: 11px;
    color: var(--dim);
    background: transparent;
    cursor: pointer;
  }
  .chip-btn:hover:not(.active) { color: var(--fg); }
  .chip-btn.active {
    color: var(--fg);
    background: color-mix(in srgb, var(--fg) 10%, transparent);
    font-weight: 600;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  select.proj-select {
    font: inherit;
    font-size: 11.5px;
    color: var(--fg);
    background: var(--background);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2.5px 6px;
    max-width: 155px;
    text-overflow: ellipsis;
  }
  select.proj-select.active-filter {
    border-color: var(--c-accent);
    font-weight: 500;
  }
  .pricing-foot {
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--dim);
  }
  .pricing-saved {
    color: var(--c-ok);
    font-weight: 600;
  }
  .link-btn {
    border: none;
    background: transparent;
    color: var(--c-accent);
    padding: 0 2px;
    font-size: 11px;
    cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; }

  /* Stat Tiles Grid */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
    margin-top: 10px;
  }
  @media (min-width: 480px) {
    .tile-grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .tile-grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }
  .stat-tile {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    min-width: 0;
  }
  .tile-label {
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile-val {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile-hint {
    font-size: 10.5px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Activity Bar Chart */
  .card-box {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 10px 8px;
    background: var(--surface);
  }
  .chart-wrap {
    position: relative;
    display: flex;
    align-items: flex-end;
    height: 86px;
    gap: 1px;
    outline: none;
    padding-top: 18px;
  }
  .chart-col {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: flex-end;
    cursor: pointer;
  }
  .chart-bar {
    width: 100%;
    border-radius: 2px 2px 0 0;
    background: var(--c-accent);
    transition: opacity 0.1s ease;
  }
  .chart-bar.empty-bar {
    background: var(--track);
    height: 1px !important;
  }
  .chart-bar.dimmed { opacity: 0.35; }
  .chart-tooltip {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    font-size: 11px;
    color: var(--fg);
    font-weight: 500;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chart-axis {
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--dim);
  }

  /* Token Composition Stacked Bar */
  .stack-track {
    display: flex;
    width: 100%;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--track);
  }
  .seg-in { background: var(--c-seg-in); }
  .seg-out { background: var(--c-seg-out); }
  .seg-think { background: var(--c-seg-think); }
  .seg-cache { background: var(--c-seg-cache); }

  .legend-grid {
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    min-width: 0;
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }
  .legend-name {
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .legend-val {
    margin-left: auto;
    font-weight: 500;
    white-space: nowrap;
  }

  /* Models & Tools Lists */
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .item-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .item-row.clickable {
    padding: 5px 6px;
    margin: -5px -6px;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .item-row.clickable:hover {
    background: color-mix(in srgb, var(--fg) 5%, transparent);
  }
  .item-row.selected {
    background: color-mix(in srgb, var(--c-accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--c-accent) 45%, transparent);
  }
  .item-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
    min-width: 0;
  }
  .item-title {
    display: flex;
    align-items: baseline;
    gap: 5px;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }
  .prov-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
    transform: translateY(-1px);
  }
  .item-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    flex: none;
  }
  .thin-track {
    display: flex;
    width: 100%;
    height: 5px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--track);
  }
  .more-btn {
    margin-top: 8px;
    width: 100%;
    font-size: 11.5px;
    padding: 4px 8px;
    text-align: center;
    color: var(--dim);
  }

  .empty {
    margin: 36px 8px;
    text-align: center;
    color: var(--dim);
  }
  footer {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--dim);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .foot-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
</style>
</head>
<body>
<main id="main"><p class="empty">Loading usage data…</p></main>

<script>
(() => {
  const POLL_MS = 15000;
  const TICK_MS = 30000;
  const MAX_DAILY_BARS = 92;
  const doFetch = (window.sidecar && window.sidecar.fetch) || fetch;
  const main = document.getElementById('main');

  // Navigation & state
  let activeTab = 'quota'; // 'quota' | 'stats'

  // Quota state
  let quotaData = null;
  let quotaRefreshing = false;
  let quotaWarning = '';

  // Stats state & cache (keyed by range::project::model)
  let statsRange = '30d';
  let statsProject = '__all__';
  let statsModel = '__all__';
  let modelDimension = 'tokens'; // 'tokens' | 'cost' | 'steps'
  let showAllTools = false;
  let activeBarIdx = null;
  const statsCache = new Map(); // key -> { data, fetchedAt }
  let statsLoading = false;
  let statsError = '';

  const fmtInt = new Intl.NumberFormat('en-US');
  const fmtCompact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
  const fmtDec = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
  const fmtPct = new Intl.NumberFormat('en-US', { style: 'percent', maximumFractionDigits: 1 });
  const fmtCost = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
  const fmtRate2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtRate4 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const fmtDay = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
  const fmtDayYear = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

  function fmtRate(v) {
    if (typeof v !== 'number' || Number.isNaN(v)) return '—';
    return Math.round(v * 100) === v * 100 ? fmtRate2.format(v) : fmtRate4.format(v);
  }

  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined) continue;
      if (k === 'className') node.className = v;
      else if (k === 'textContent') node.textContent = v;
      else node.setAttribute(k, String(v));
    }
    for (const child of children) {
      if (child === null || child === undefined) continue;
      if (typeof child === 'string') node.appendChild(document.createTextNode(child));
      else node.appendChild(child);
    }
    return node;
  }

  function statsKey(range = statsRange, project = statsProject, model = statsModel) {
    return `${range}::${project}::${model}`;
  }

  // --- Shared Header ---------------------------------------------------------

  function buildHeader() {
    const isBusy = activeTab === 'quota' ? quotaRefreshing : statsLoading;
    const hasWarn = activeTab === 'quota' ? Boolean(quotaWarning) : Boolean(statsError);
    const liveClass = hasWarn ? 'live err' : 'live on';

    const quotaBtn = el('button', {
      type: 'button',
      className: `tab-btn${activeTab === 'quota' ? ' active' : ''}`,
      textContent: 'Quota',
    });
    quotaBtn.addEventListener('click', () => {
      if (activeTab === 'quota') return;
      activeTab = 'quota';
      render();
      if (!quotaData) refreshQuota(false);
    });

    const statsBtn = el('button', {
      type: 'button',
      className: `tab-btn${activeTab === 'stats' ? ' active' : ''}`,
      textContent: 'Stats',
    });
    statsBtn.addEventListener('click', () => {
      if (activeTab === 'stats') return;
      activeTab = 'stats';
      render();
      loadStats(false);
    });

    const refreshBtn = el('button', {
      type: 'button',
      textContent: isBusy ? 'Refreshing…' : 'Refresh',
    });
    if (isBusy) refreshBtn.disabled = true;
    refreshBtn.addEventListener('click', () => {
      if (activeTab === 'quota') refreshQuota(true);
      else loadStats(true);
    });

    return el('div', { className: 'top' }, [
      el('div', { className: 'title-wrap' }, [
        el('span', { className: liveClass, title: (hasWarn && (quotaWarning || statsError)) || 'Live' }),
        el('div', { className: 'tab-bar', role: 'tablist' }, [quotaBtn, statsBtn]),
      ]),
      refreshBtn,
    ]);
  }

  // --- Quota Tab Builders ----------------------------------------------------

  function formatQuotaPct(fraction) {
    if (typeof fraction !== 'number' || Number.isNaN(fraction)) return '0%';
    const pct = Math.max(0, Math.min(100, fraction * 100));
    if (pct === 0 || pct === 100) return `${Math.round(pct)}%`;
    return `${pct.toFixed(1)}%`;
  }

  function formatUsedPct(fraction) {
    if (typeof fraction !== 'number' || Number.isNaN(fraction)) return '100% used';
    const used = Math.max(0, Math.min(100, (1 - fraction) * 100));
    if (used === 0) return '0% used';
    if (used < 0.1) return '<0.1% used';
    return `${used.toFixed(1)}% used`;
  }

  function formatResetInfo(resetTimeStr) {
    if (!resetTimeStr) return { countdown: 'No reset timer', exact: '' };
    const resetDate = new Date(resetTimeStr);
    if (Number.isNaN(resetDate.getTime())) return { countdown: 'Unknown reset', exact: '' };

    const diffMs = resetDate.getTime() - Date.now();
    let countdown;
    if (diffMs <= 0) {
      countdown = 'Resets in <1m';
    } else {
      const totalMins = Math.floor(diffMs / 60000);
      const days = Math.floor(totalMins / 1440);
      const hours = Math.floor((totalMins % 1440) / 60);
      const mins = totalMins % 60;
      if (days > 0) {
        countdown = hours > 0 ? `Resets in ${days}d ${hours}h` : `Resets in ${days}d`;
      } else if (hours > 0) {
        countdown = mins > 0 ? `Resets in ${hours}h ${mins}m` : `Resets in ${hours}h`;
      } else {
        countdown = mins > 0 ? `Resets in ${mins}m` : 'Resets in <1m';
      }
    }

    const now = new Date();
    const sameDay = resetDate.toDateString() === now.toDateString();
    const timeStr = resetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const exact = sameDay
      ? `At ${timeStr}`
      : `${resetDate.toLocaleDateString([], { month: 'numeric', day: 'numeric' })} ${timeStr}`;

    return { countdown, exact };
  }

  const WINDOW_UNITS_MS = { s: 1000, m: 60000, h: 3600000, d: 86400000, w: 7 * 86400000 };

  function getWindowDurationMs(bucket) {
    const w = String(bucket.window || '').trim().toLowerCase();
    if (w === 'weekly') return 7 * 86400000;
    if (w === 'daily') return 86400000;
    const m = /^(\d+)([smhdw])$/.exec(w);
    if (m) return Number(m[1]) * WINDOW_UNITS_MS[m[2]];
    const id = String(bucket.bucketId || '').toLowerCase();
    if (id.endsWith('-weekly')) return 7 * 86400000;
    if (id.endsWith('-5h')) return 5 * 3600000;
    return 0;
  }

  function getWindowTimeRemainingPct(bucket) {
    if (!bucket.resetTime) return null;
    const windowMs = getWindowDurationMs(bucket);
    if (windowMs <= 0) return null;
    const resetMs = new Date(bucket.resetTime).getTime();
    if (Number.isNaN(resetMs)) return null;
    const diffMs = resetMs - Date.now();
    if (diffMs <= 0) return null;
    return Math.max(0, Math.min(100, (diffMs / windowMs) * 100));
  }

  function parseDayStr(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function dateKeyOf(date) {
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${m}-${d}`;
  }

  function buildActivitySeries(stats) {
    const stepsByDay = new Map((stats.activity || []).map((d) => [d.date, d.steps]));
    const from = new Date(stats.range.from);
    const cursor = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    const last = new Date(Math.max(stats.range.from, stats.range.to - 1));
    const lastKey = dateKeyOf(last);
    const days = [];
    for (let guard = 0; guard < 3650; guard++) {
      const key = dateKeyOf(cursor);
      days.push({ start: key, end: key, steps: stepsByDay.get(key) || 0 });
      if (key >= lastKey) break;
      cursor.setDate(cursor.getDate() + 1);
    }

    if (days.length <= MAX_DAILY_BARS) {
      const max = days.reduce((m, d) => Math.max(m, d.steps), 0);
      return { unit: 'day', bars: days, max };
    }

    const weeks = [];
    for (let i = 0; i < days.length; i += 7) {
      const chunk = days.slice(i, i + 7);
      const sum = chunk.reduce((acc, d) => acc + d.steps, 0);
      weeks.push({
        start: chunk[0].start,
        end: chunk[chunk.length - 1].end,
        steps: sum,
      });
    }
    const max = weeks.reduce((m, w) => Math.max(m, w.steps), 0);
    return { unit: 'week', bars: weeks, max };
  }

  function formatDurationMs(ms) {
    if (typeof ms !== 'number' || Number.isNaN(ms)) return '—';
    if (ms < 1000) return `${Math.round(ms)} ms`;
    const sec = ms / 1000;
    if (sec < 60) return `${sec.toFixed(1)} s`;
    const mins = Math.floor(sec / 60);
    const remSec = Math.round(sec % 60);
    return remSec > 0 ? `${mins}m ${remSec}s` : `${mins}m`;
  }

    const count = series.bars.length;

    const describeBar = (bar) => {
      const dateStr = bar.start === bar.end
        ? fmtDayYear.format(parseDayStr(bar.start))
        : `${fmtDay.format(parseDayStr(bar.start))} – ${fmtDayYear.format(parseDayStr(bar.end))}`;

      className: 'chart-tooltip num',
      textContent: activeBarIdx !== null && series.bars[activeBarIdx]
        ? describeBar(series.bars[activeBarIdx])

    const barCols = series.bars.map((bar, idx) => {
      const hPct = series.max > 0 ? Math.max(bar.steps > 0 ? 5 : 0, (bar.steps / series.max) * 100) : 0;
      const barEl = el('div', {
        className: `chart-bar${bar.steps === 0 ? ' empty-bar' : ''}${activeBarIdx !== null && activeBarIdx !== idx ? ' dimmed' : ''}`,
        style: bar.steps > 0 ? `height: ${hPct.toFixed(1)}%` : '',

    const chartWrap = el('div', {

        const segs = getTokenSegments(m.tokens).filter((s) => s.value > 0);
        barInner = el('div', {
          style: `display:flex;height:100%;width:${sharePct.toFixed(1)}%`,
        }, segs.map((s) => el('div', {
          className: s.cls,
          style: `height:100%;width:${((s.value / m.tokens.total) * 100).toFixed(2)}%`,
        })));
      } else {
        barInner = el('div', {
          className: 'seg-in',
          style: `height:100%;width:${sharePct.toFixed(1)}%`,
        });
      }

      const rowEl = el('li', {
        className: `item-row clickable${isSelected ? ' selected' : ''}`,
        title: `${m.providerName} · ${m.modelID}${tpsHint}${priceHint} (click to filter)`,
      }, [
        el('div', { className: 'item-head' }, [
          el('div', { className: 'item-title' }, [
            el('span', { className: 'prov-badge', textContent: provInitial }),
            el('span', { className: 'item-name', textContent: m.displayName }),
            m.variant ? el('span', { className: 'tag', textContent: m.variant }) : null,
          ]),
          el('span', { className: 'item-meta num', textContent: rightText }),
        ]),
        el('div', { className: 'thin-track' }, [barInner]),
      ]);
      rowEl.addEventListener('click', () => {
        selectModelFilter(statsModel === mKey ? '__all__' : mKey);
      });
      return rowEl;
    });

    return el('section', {}, [
      el('div', { className: 'sec-head' }, [
        el('div', { style: 'display:flex;align-items:baseline;gap:6px' }, [
          el('h2', { textContent: 'Models' }),
          el('span', { className: 'sec-caption', textContent: 'Click row to filter & inspect API pricing' }),
        ]),
        models.length > 0 ? el('div', { className: 'chip-group' }, dimButtons) : null,
      ]),
      models.length === 0
        ? el('p', { className: 'sec-sub', textContent: 'No model usage in this period.' })
        : el('div', { className: 'card-box' }, [el('ul', { className: 'item-list' }, listItems)]),
    ]);
  }

  function buildToolsSection(stats) {
    const totals = stats.tools?.totals || { calls: 0, succeeded: 0, failed: 0, unfinished: 0 };
    const usage = Array.isArray(stats.tools?.usage) ? stats.tools.usage : [];
    const completed = totals.succeeded + totals.failed;
    const successRate = completed > 0 ? fmtPct.format(totals.succeeded / completed) : '—';

    const visibleRows = showAllTools ? usage : usage.slice(0, 8);
    const listItems = visibleRows.map((tool) => {
      const metaText = tool.durationP50 !== null
        ? `calls: ${fmtInt.format(tool.calls)} · median: ${formatDurationMs(tool.durationP50)}`
        : `calls: ${fmtInt.format(tool.calls)}`;
      const okPct = tool.calls > 0 ? (tool.succeeded / tool.calls) * 100 : 0;
      const errPct = tool.calls > 0 ? (tool.failed / tool.calls) * 100 : 0;

      return el('li', { className: 'item-row' }, [
        el('div', { className: 'item-head' }, [
          el('span', { className: 'item-name mono', textContent: tool.name, title: tool.name }),
          el('span', { className: 'item-meta num', textContent: metaText }),
        ]),
        el('div', { className: 'thin-track' }, [
          tool.succeeded > 0 ? el('div', { className: 'seg-out', style: `height:100%;width:${okPct.toFixed(1)}%` }) : null,
          tool.failed > 0 ? el('div', { className: 'bar-fill danger', style: `height:100%;width:${errPct.toFixed(1)}%` }) : null,
        ]),
      ]);
    });

    let toggleBtn = null;
    if (usage.length > 8) {
      toggleBtn = el('button', {
        type: 'button',
        className: 'more-btn',
        textContent: showAllTools ? 'Show top 8' : `Show all (${usage.length} tools)`,
      });
      toggleBtn.addEventListener('click', () => {
        showAllTools = !showAllTools;
        render();
      });
    }

    return el('section', {}, [
      el('div', { className: 'sec-head' }, [
        el('h2', { textContent: 'Tool calls' }),
        el('span', { className: 'sec-caption num', textContent: `${usage.length} distinct tools` }),
      ]),
      el('div', { className: 'tile-grid cols-4', style: 'margin-top:0;margin-bottom:8px' }, [
        buildStatTile('Calls', fmtInt.format(totals.calls)),
        buildStatTile('Success rate', successRate),
        buildStatTile('Failed', fmtInt.format(totals.failed)),
        buildStatTile('Unfinished', fmtInt.format(totals.unfinished)),
      ]),
      usage.length > 0
        ? el('div', { className: 'card-box' }, [
            el('ul', { className: 'item-list' }, listItems),
            toggleBtn,
          ])
        : null,
    ]);
  }

  function buildStatsNodes() {
    const cached = statsCache.get(statsKey());
    const stats = cached?.data || null;
    const fallbackData = Array.from(statsCache.values()).find((c) => c?.data?.models?.length)?.data
      || Array.from(statsCache.values())[0]?.data
      || null;
    const anyProjects = stats?.projects || fallbackData?.projects || [];
    const anyModels = (stats?.models?.length ? stats.models : fallbackData?.models) || [];
    const anyFamilies = (stats?.modelFamilies?.length ? stats.modelFamilies : fallbackData?.modelFamilies) || [];

    const nodes = [buildStatsToolbar(anyProjects, anyModels, anyFamilies, stats?.selectedModel)];

    if (statsError && !stats) {
      const retryBtn = el('button', { type: 'button', textContent: 'Try again' });
      retryBtn.addEventListener('click', () => loadStats(true));
      nodes.push(el('div', { className: 'notice error', textContent: `Couldn't load stats: ${statsError}` }));
      nodes.push(el('div', { style: 'margin-top:8px' }, [retryBtn]));
      return nodes;
    }

    if (!stats) {
      nodes.push(el('p', { className: 'empty', textContent: 'Loading stats…' }));
      return nodes;
    }

    if (statsError) {
      nodes.push(el('div', { className: 'notice', textContent: `Refresh failed (${statsError}). Showing cached stats.` }));
    }

    const pricingCard = buildSelectedModelPricingSection(stats);

    if (stats.prompts === 0 && stats.steps === 0) {
      if (pricingCard) nodes.push(pricingCard);
      nodes.push(el('div', { className: 'empty' }, [
        el('div', { style: 'font-weight:600;color:var(--fg);margin-bottom:3px', textContent: 'No activity in this period' }),
        el('div', { textContent: 'Sessions you run will show up here.' }),
      ]));
      return nodes;
    }

    const t = stats.tokens || {};
    const outAndThink = (t.output || 0) + (t.reasoning || 0);
    nodes.push(el('div', { className: 'tile-grid cols-3' }, [
      buildStatTile('Sessions', fmtInt.format(stats.sessions), `Subagents: ${fmtInt.format(stats.subagents)}`),
      buildStatTile('Prompts', fmtInt.format(stats.prompts), `Steps: ${fmtInt.format(stats.steps)} · Compacted: ${fmtInt.format(stats.compactions || 0)}`),
      buildStatTile(
        'Tokens',
        fmtCompact.format(t.total || 0),
        `In ${fmtCompact.format(t.input || 0)} · Out ${fmtCompact.format(outAndThink)} · Cache ${fmtCompact.format(t.cacheRead || 0)}`
      ),
      buildStatTile('Est. Cost', fmtCost.format(stats.cost || 0), 'Public API equivalent'),
      buildStatTile('Active days', fmtInt.format(stats.activeDays || 0)),
      buildStatTile('Longest streak', `${fmtInt.format(stats.streak || 0)}d`),
    ]));

    if (pricingCard) {
      nodes.push(pricingCard);
    }

    nodes.push(buildActivitySection(stats));

    const tokComp = buildTokenCompositionSection(stats);
    if (tokComp) nodes.push(tokComp);

    nodes.push(buildEfficiencySection(stats));
    nodes.push(buildModelsSection(stats));
    nodes.push(buildToolsSection(stats));

    const updatedTime = stats.updatedAt
      ? new Date(stats.updatedAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : '';
    nodes.push(el('footer', {}, [
      el('div', { className: 'foot-row num' }, [
        el('span', { textContent: 'Scanned local conversation databases' }),
        el('span', { textContent: updatedTime ? `Updated ${updatedTime}` : '' }),
      ]),
    ]));

    return nodes;
  }

  function render() {
    const header = buildHeader();
    const bodyNodes = activeTab === 'quota' ? buildQuotaNodes() : buildStatsNodes();
    main.replaceChildren(header, ...bodyNodes);
  }

  // --- Data Loaders ----------------------------------------------------------

  async function refreshQuota(force = false) {
    if (!force && document.hidden) return;
    if (quotaRefreshing) return;
    quotaRefreshing = true;
    render();

    try {
      const qs = force ? '?force=1' : '';
      const res = await doFetch(`/api/usage${qs}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.message || data.error);
      quotaData = data;
      quotaWarning = '';
      quotaRefreshing = false;
      render();
    } catch (err) {
      quotaRefreshing = false;
      quotaWarning = err.message || 'Unknown error';
      render();
    }
  }

  async function loadStats(force = false) {
    const key = statsKey();
    if (!force && statsCache.has(key)) {
      render();
      return;
    }
    if (statsLoading) return;
    statsLoading = true;
    statsError = '';
    render();

    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      const params = new URLSearchParams({
        range: statsRange,
        project: statsProject,
        model: statsModel,
        tz,
        force: force ? '1' : '0',
      });
      const res = await doFetch(`/api/stats?${params.toString()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.message || data.error);
      if (force) statsCache.clear();
      statsCache.set(key, { data, fetchedAt: Date.now() });
      statsLoading = false;
      statsError = '';
      render();
    } catch (err) {
      statsLoading = false;
      statsError = err.message || 'Unknown error';
      render();
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && activeTab === 'quota') refreshQuota(false);
  });

  refreshQuota(false);
  setInterval(() => {
    if (activeTab === 'quota') refreshQuota(false);
  }, POLL_MS);
  setInterval(() => {
    if (!document.hidden && activeTab === 'quota' && quotaData && !quotaRefreshing) render();
  }, TICK_MS);
})();
</script>
</body>
</html>
